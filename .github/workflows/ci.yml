name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage

  mutation:
    # The sizing engine's mutation gate (PRD Milestone 1): runs when the engine changes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Skip unless src/engine changed
        id: changed
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- src/engine; then
            echo "engine=false" >> "$GITHUB_OUTPUT"
          else
            echo "engine=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.changed.outputs.engine == 'true'
      - uses: actions/setup-node@v5
        if: steps.changed.outputs.engine == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changed.outputs.engine == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changed.outputs.engine == 'true'
        run: pnpm test:mutation
