name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Actions are pinned to full commit SHAs and the Playwright image to a digest: a moved tag can't
# change the code that runs next to the Cloudflare token (security review, 2026-10-05).
# To update, resolve the new release's SHA/digest and keep the version comment beside it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Bundle budgets (JS 90 KB, CSS 15 KB, fonts 30 KB)
        run: pnpm size

  e2e:
    # Pixel 7 (Chromium), iPhone 14 (WebKit) and a 1440 px desktop (three-pane layout), with axe,
    # plus the offline, update-flow and no-network specs (service-worker specs run on Chromium).
    #
    # Runs inside Playwright's own image: browsers and their Linux libraries are preinstalled, so
    # there is no `playwright install --with-deps` step (its apt-get hung for 30+ minutes in CI run
    # 37329382936). The image tag must match @playwright/test in package.json.
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium
            args: --project=pixel-7 --project=desktop
          # Linux WebKit hangs or crashes under parallel load (CI run 37323852960); the same flows
          # pass reliably one at a time, so the iPhone project gets its own job and one worker.
          - name: webkit
            args: --project=iphone-14 --workers=1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright test ${{ matrix.args }}
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.name }}
          path: |
            test-results/
            playwright-report/

  lighthouse:
    # Performance, accessibility and best practices >= 0.9, on the build served by
    # `wrangler pages dev` so the real Cloudflare _headers apply (M4-D9).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lhci
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse
          path: reports/lighthouse/

  mutation:
    # The sizing engine's mutation gate (PRD Milestone 1): runs when the engine changes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Skip unless src/engine changed
        id: changed
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- src/engine; then
            echo "engine=false" >> "$GITHUB_OUTPUT"
          else
            echo "engine=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.changed.outputs.engine == 'true'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.changed.outputs.engine == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changed.outputs.engine == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changed.outputs.engine == 'true'
        run: pnpm test:mutation

  deploy:
    # Publishes to https://r2size.pages.dev, only for pushes to master, only when every check
    # above is green, and only after the owner approves the run in GitHub (environment
    # "production", required reviewer). Then verifies the live site.
    needs: [check, e2e, lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright's image, so the production no-network check can run without installing browsers.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    environment:
      name: production
      url: https://r2size.pages.dev
    # One deploy at a time; a newer approved run waits for the current one instead of racing it.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        # Only the commit hash is passed: putting the commit message into a shell command would
        # let quotes or backticks in a message break (or inject into) the deploy step.
        run: pnpm exec wrangler pages deploy dist --project-name r2size --branch master --commit-hash "$GITHUB_SHA"
      - name: Live site serves this build with its security headers
        run: node scripts/verify-production.mjs https://r2size.pages.dev
      - name: Nothing leaves the device on production
        env:
          BASE_URL: https://r2size.pages.dev
        run: pnpm exec playwright test e2e/no-network.spec.ts --project=pixel-7 --project=desktop
