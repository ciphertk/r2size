name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Bundle budgets (JS 90 KB, CSS 15 KB, fonts 30 KB)
        run: pnpm size

  e2e:
    # Pixel 7 (Chromium), iPhone 14 (WebKit) and a 1440 px desktop (three-pane layout), with axe,
    # plus the offline, update-flow and no-network specs (service-worker specs run on Chromium).
    #
    # Runs inside Playwright's own image: browsers and their Linux libraries are preinstalled, so
    # there is no `playwright install --with-deps` step (its apt-get hung for 30+ minutes in CI run
    # 37329382936). The image tag must match @playwright/test in package.json.
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium
            args: --project=pixel-7 --project=desktop
          # Linux WebKit hangs or crashes under parallel load (CI run 37323852960); the same flows
          # pass reliably one at a time, so the iPhone project gets its own job and one worker.
          - name: webkit
            args: --project=iphone-14 --workers=1
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright test ${{ matrix.args }}
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.name }}
          path: |
            test-results/
            playwright-report/

  lighthouse:
    # Performance, accessibility and best practices >= 0.9, on the build served by
    # `wrangler pages dev` so the real Cloudflare _headers apply (M4-D9).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lhci
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: reports/lighthouse/

  mutation:
    # The sizing engine's mutation gate (PRD Milestone 1): runs when the engine changes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Skip unless src/engine changed
        id: changed
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- src/engine; then
            echo "engine=false" >> "$GITHUB_OUTPUT"
          else
            echo "engine=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.changed.outputs.engine == 'true'
      - uses: actions/setup-node@v5
        if: steps.changed.outputs.engine == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changed.outputs.engine == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changed.outputs.engine == 'true'
        run: pnpm test:mutation
